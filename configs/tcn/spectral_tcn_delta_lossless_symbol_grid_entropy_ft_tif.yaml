experiment:
  name: spectral_tcn_delta_lossless_symbol_grid_entropy_ft_tif
  seed: 42

data:
  difficulty: easy
  batch_size: 32
  num_workers: 4
  drop_invalid_channels: true
  prefer_npy: false
  pin_memory: true
  prefetch_factor: 2
  train_subset_size: 4096
  val_subset_size: 1024

model:
  model_name: spectral_tcn_delta_lossless
  model_kwargs:
    hidden_channels: 48
    num_blocks: 6
    kernel_size: 3
    dropout: 0.0
    output_activation: tanh
    symbol_scale: 10000
    zlib_level: 9
    raw_fallback: false
    residual_backend: zstd
    residual_transform: zigzag+bitplane
    pixels_per_patch: 512

training:
  epochs: 10
  lr: 0.00003
  loss_name: symbol_code_length
  loss_kwargs:
    symbol_scale: 10000
    code_weight: 0.0001
    mse_weight: 1.0
    value_min: -1.0
    value_max: 1.0
  grad_clip_max_norm: 1.0
  use_amp: true
  fast_train_metrics: true
  sam_every_n_epochs: 10

logging:
  project: hsi-compression-paper
  use_wandb: true
