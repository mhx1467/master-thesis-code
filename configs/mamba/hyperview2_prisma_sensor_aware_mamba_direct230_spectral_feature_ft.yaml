experiment:
  name: hyperview2_prisma_sensor_aware_mamba_direct230_spectral_feature_ft
  seed: 42

data:
  dataset: hyperview2
  modality: prisma
  normalization: reflectance_0_1
  spectral_mapping: null
  val_fraction: 0.2
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  pad_multiple: 4
  min_spatial_size: 4
  subset_seed: 42
  train_subset_size: null
  val_subset_size: null

training:
  use_amp: true
  epochs: 40
  lr: 0.00002
  loss_name: rate_distortion
  rd_lambda: 0.001
  distortion_metric: spectral_feature
  distortion_kwargs:
    pixel_weight: 1.0
    mean_weight: 0.5
    std_weight: 0.25
    first_derivative_weight: 1.0
    second_derivative_weight: 0.25
    spectral_cosine_weight: 0.01
  grad_clip_max_norm: 1.0
  sam_every_n_epochs: 5
  fast_train_metrics: true
  scheduler:
    enabled: true
    name: cosine
    T_max: 40
    eta_min: 1.0e-06
  early_stopping:
    enabled: true
    patience: 10
    psnr_min_delta: 0.0

model:
  model_name: hierarchical_spectral_mamba_sensor_aware
  model_kwargs:
    in_channels: 230
    latent_channels: 96
    group_size: 4
    spectral_d_model: 64
    spectral_mlp_hidden_dim: 128
    spectral_out_channels: 96
    num_summary_tokens: 4
    num_local_blocks: 2
    num_global_blocks: 1
    wavelength_embedding_dim: 16
    wavelength_num_frequencies: 8
    wavelength_preset: linear_0_1
    wavelength_min_nm: 400.0
    wavelength_max_nm: 2500.0
    spatial_embed_channels: 16
    spatial_context_channels: 64
    mamba_d_state: 16
    mamba_d_conv: 4
    mamba_expand: 2
    use_spatial_conditioning: true
    use_affine_conditioning: true
    use_sensor_adapter: true
    sensor_adapter_hidden_dim: 32
    sensor_adapter_scale_limit: 0.25
    sensor_adapter_bias_limit: 0.05
    spectral_chunk_size: 512
    decoder_band_chunk_size: 64
    spectral_augmentation:
      enabled: false
    output_activation: sigmoid
    dropout: 0.0

logging:
  use_wandb: true
  project: hsi-compression-paper
